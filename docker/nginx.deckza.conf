server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirect memakai $http_host (bukan path relatif). Path relatif membuat nginx
    # menyusun URL absolut dengan port internal container (80), sehingga browser
    # diarahkan ke :80 dan berakhir ERR_CONNECTION_TIMED_OUT.
    location = /deckza {
        return 301 http://$http_host/deckza/;
    }

    location /deckza/ {
        try_files $uri $uri/ /deckza/index.html;
    }

    # Gambar di Razor memakai path absolut (/images/...), jadi dipetakan ke subfolder.
    # Pakai root (bukan alias) agar tidak terkena quirk try_files + alias.
    location /images/ {
        root /usr/share/nginx/html/deckza;
    }

    location / {
        return 302 http://$http_host/deckza$request_uri;
    }
}
