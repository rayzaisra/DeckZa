services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: 'pass@word1@'
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U mis -P 'pass@word1@' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: 'Server=sql,1433;Database=deckza_db;User Id=mis;Password=pass@word1@;TrustServerCertificate=True;Encrypt=False'
      ConnectionStrings__AuditLogConnection: 'Server=sql,1433;Database=deckza_log_db;User Id=mis;Password=pass@word1@;TrustServerCertificate=True;Encrypt=False'
      Seed__Enabled: "true"
      Cors__AllowedOrigins__0: "http://localhost:44353"
    ports:
      - "7143:8080"
    depends_on:
      sql:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "44353:80"
    depends_on:
      - api
