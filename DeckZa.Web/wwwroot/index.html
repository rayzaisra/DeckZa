<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DeckZa keeps tasks, schedules, and reports in one focused workspace." />
    <meta name="theme-color" content="#09090b" />
    <meta property="og:title" content="DeckZa" />
    <meta property="og:description" content="Tasks, schedules, and reports in one workspace." />
    <meta property="og:type" content="website" />
    <title>DeckZa</title>
    <base href="/" />
    <script>
        (function () {
            var allowed = ["default", "fintech", "monochrome", "creative", "wellness"];
            var palette = "monochrome";
            var style = "neo";
            var mode = "light";
            var repeat = false;
            try {
                var saved = localStorage.getItem("enterprise-ui-palette");
                if (saved) palette = saved;
                var savedStyle = localStorage.getItem("enterprise-ui-style");
                if (savedStyle) style = savedStyle;
                var savedMode = localStorage.getItem("enterprise-ui-theme-mode");
                if (savedMode) mode = savedMode;
                repeat = sessionStorage.getItem("ryz-boot-seen") === "1";
                sessionStorage.setItem("ryz-boot-seen", "1");
            } catch (e) { }
            if (allowed.indexOf(palette) < 0) palette = "default";
            document.documentElement.setAttribute("data-palette", palette);
            document.documentElement.setAttribute("data-style", style);
            document.documentElement.setAttribute("data-theme-mode", mode);
            if (repeat) document.documentElement.classList.add("ryz-boot-repeat");
        })();
    </script>
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="_content/MudBlazor/MudBlazor.min.css" />
    <link rel="stylesheet" href="_content/DeckZa.Shared/css/app.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <script type="importmap"></script>
</head>

<body>
    <div class="ryz-boot" data-ryz-boot role="status" aria-live="polite">
        <div class="ryz-boot-card">
            <img src="images/branding/app-logo.png" alt="" />
            <div class="ryz-boot-brand">DeckZa</div>
            <div class="ryz-boot-kicker">Personal Task and Report Management</div>
            <div class="ryz-boot-stage">Loading workspace</div>
            <div class="ryz-boot-track">
                <div class="ryz-boot-bar" data-ryz-boot-bar></div>
            </div>
            <div class="ryz-boot-text"></div>
        </div>
    </div>

    <div id="app"></div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>
        window.ryzBootReady = function () {
            var root = document.documentElement;
            if (root.classList.contains("ryz-boot-ready")) {
                return;
            }
            root.classList.add("ryz-boot-ready");
            window.setTimeout(function () {
                var boot = document.querySelector("[data-ryz-boot]");
                if (boot) {
                    boot.remove();
                }
            }, 650);
        };
        window.setTimeout(function () {
            if (window.ryzBootReady) {
                window.ryzBootReady();
            }
        }, 12000);
        window.ryzMotionModule = (window.ryzMotionModule
            || import("./_content/DeckZa.Shared/js/ryzcore-motion.js"))
            .catch(function () { return null; });
        window.ryzMotionInvoke = function (method, args) {
            return window.ryzMotionModule.then(function (module) {
                if (module && typeof module[method] === "function") {
                    module[method].apply(null, args || []);
                    return true;
                }
                return false;
            });
        };
    </script>
</body>

</html>
